# Java4Shell lab: isolated, capped, no published ports.
# Bring up with ./setup.sh on an x86-64 AVX-512 VBMI host.
name: java4shell-lab

networks:
  j4s:
    driver: bridge

volumes:
  manager-logs:

services:
  # The endpoint: a known-affected JDK with a Wazuh agent on the same box. The agent runs
  # the exposure scan (Layer 1), tails hs_err crash files (Layer 2) and a sample proxy
  # log (Layer 3). Container name stays j4s-target: it is the thing being attacked.
  target:
    build:
      context: ..
      dockerfile: lab/endpoint/Dockerfile
    container_name: j4s-target
    hostname: j4s-endpoint
    # A real init is required. On first connect the manager tells the agent to restart;
    # without an init to reap the stopped daemons, `wazuh-control restart` waits forever
    # on zombie processes and the agent never comes back.
    init: true
    networks: [j4s]
    mem_limit: 1g
    cpus: 2.0
    ulimits:
      core: 0            # a crashing JVM must not leave core files behind
    depends_on: [wazuh-manager]

  # Wazuh manager only (no indexer/dashboard) to stay light on a shared host.
  # Alerts land in /var/ossec/logs/alerts/alerts.json. Filebeat inside the image will
  # complain that it has no indexer; that is expected and harmless here.
  wazuh-manager:
    image: wazuh/wazuh-manager:4.9.2
    container_name: j4s-manager
    hostname: wazuh-manager
    networks: [j4s]
    mem_limit: 2g
    cpus: 2.0
    # No published host ports: the agent reaches the manager over the internal j4s
    # network by service name, so the lab cannot collide with a Wazuh stack the host
    # already runs on 1514/1515/55000.
    #
    # Do NOT bind-mount the decoder/rule files into /var/ossec/etc. The image populates
    # /var/ossec/etc (a declared volume) at first boot; mounting single files into
    # etc/decoders or etc/rules pre-creates those directories as mountpoints and breaks
    # the entrypoint's config restore (ossec.conf and the stock ruleset go missing and no
    # daemon starts). setup.sh installs the custom files with `docker cp` once the
    # manager is up, which is also the copy-then-restart a real deployment does.
    volumes:
      - manager-logs:/var/ossec/logs
