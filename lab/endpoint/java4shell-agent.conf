<!--
  Lab agent config. The Dockerfile appends this to the agent ossec.conf wrapped in its
  own <ossec_config> block. For a real agent, paste the blocks inside <ossec_config>.
  Pair with the decoder and rules in ../../rules/ on the manager.
-->

<!-- Layer 1: periodic exposure inventory (every 2 minutes in the lab; daily in production). -->
<localfile>
  <log_format>command</log_format>
  <command>sh /var/ossec/active-response/bin/java4shell-check.sh</command>
  <alias>java4shell-check</alias>
  <frequency>120</frequency>
</localfile>

<!-- Layer 2: collect the JVM crash report.
     Do NOT tail /path/hs_err_pid*.log with a wildcard. Verified on Wazuh 4.9.2: when
     logcollector discovers a new file that matches a wildcard it starts at the END of
     the file, with or without only-future-events. A JVM writes hs_err once and never
     appends, so nothing is shipped and no crash rule can fire.
     Instead start the JVM with -XX:+ErrorFileToStderr and tail the log that already
     receives the service's stderr (a file here; journald or the container log on a
     real host). The file must exist before the agent starts. -->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/jvm/service-stderr.log</location>
</localfile>

<!-- Layer 3 (lab only): stands in for a reverse proxy access log that records the
     Authorization value as JSON. lab/replay-tokens.sh appends sample lines to it. -->
<localfile>
  <log_format>json</log_format>
  <location>/var/log/j4s/proxy-auth.json</location>
</localfile>
