<!--
  Append these blocks to the Wazuh agent ossec.conf (inside <ossec_config>).
  Pair with the decoder and rules in ../../rules/ on the manager.
-->

<!-- Layer 1: periodic exposure inventory (hourly in the lab; daily in production). -->
<localfile>
  <log_format>command</log_format>
  <command>sh /var/ossec/active-response/bin/java4shell-check.sh</command>
  <alias>java4shell-check</alias>
  <frequency>3600</frequency>
</localfile>

<!-- Layer 2: collect JVM fatal-error files.
     Start JVMs with -XX:ErrorFile=/var/log/jvm/hs_err_pid%p.log -->
<localfile>
  <log_format>syslog</log_format>
  <location>/var/log/jvm/hs_err_pid*.log</location>
</localfile>
